services:
  minio:
    # pgsty community fork — minio/minio is archived (Apr 2026), no longer maintained.
    # Verified 2026-08-07. Check github.com/pgsty/minio/releases before re-pinning.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - ./minio_data:/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-db:
    image: postgres:16
    container_name: lakehouse-catalog-db
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper
      POSTGRES_DB: lakekeeper
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper"]
      interval: 5s
      retries: 10

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.12.0
    command: ["migrate"]
    environment: &lakekeeper_env
      LAKEKEEPER__PG_ENCRYPTION_KEY: local-dev-only-not-a-real-key
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://lakekeeper:lakekeeper@catalog-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://lakekeeper:lakekeeper@catalog-db:5432/lakekeeper
      LAKEKEEPER__BASE_URI: http://lakekeeper:8181
    depends_on:
      catalog-db:
        condition: service_healthy

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.12.0
    container_name: lakehouse-catalog
    command: ["serve"]
    environment: *lakekeeper_env
    ports:
      - "8181:8181"
    mem_limit: 512m
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully

  trino:
    image: trinodb/trino:483
    container_name: lakehouse-trino
    ports:
      - "8090:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STAGE2_PG_USER: ${STAGE2_PG_USER}
      STAGE2_PG_PASSWORD: ${STAGE2_PG_PASSWORD}
      STAGE2_PG_DB: ${STAGE2_PG_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 4g

volumes:
  catalog_db_data: