services:
  minio:
    # pgsty community fork — minio/minio is archived (Apr 2026), no longer maintained.
    # Verified 2026-08-07. Check github.com/pgsty/minio/releases before re-pinning.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - ./minio_data:/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5