[project]
name = "player-intelligence-lakehouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "pyarrow>=25.0.1",
    "pyiceberg[pyiceberg-core,s3fs,sql-postgres]==0.11.1",
    "pyspark==4.0.1",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse"]

[tool.hatch.build.targets.wheel.force-include]
"src/lakehouse/seed.sql" = "lakehouse/seed.sql"
